# The live test server: the game from the deployed image, and the sidecar that serves jav_config.ws, slr.ws and the
# LOCAL_AUTH sign-in to the Android app (http) and to desktop clients (http-desktop). `track.sh ship` runs it with
# switch.env and SIDECAR_DATA; the image tag osrs-openrune:241 is moved by ship, never built here. Both sidecars serve
# jav_config.ws.template from this directory: every host in it is the sidecar's own (javcheck.py checks the served body).
name: osrs-openrune
services:
  openrune:
    image: osrs-openrune:241
    container_name: osrs-openrune
    restart: unless-stopped
    ports: ["${OPENRUNE_GAME_PORT:-40255}:43594"]
    volumes: [openrune-pgdata:/app/.data/postgres]
    environment: {JAVA_OPTS: "-Xmx2g"}
  http:
    image: osrs-rsps-test:241
    container_name: osrs-openrune-http
    restart: unless-stopped
    ports: ["${OPENRUNE_HTTP_PORT:-8081}:8080"]
    volumes: ["${SIDECAR_DATA}:/data:ro", "./jav_config.ws.template:/app/protocol/jav_config.ws.template:ro"]
    environment: {WORLD_HOST: "10.0.2.2", HTTP_PUBLIC_PORT: "${OPENRUNE_HTTP_PORT:-8081}", WORLD_ID: "255", SAVE_DIR: /tmp/saves,
                  JAV_CONFIG_TEMPLATE: /app/protocol/jav_config.ws.template, LOCAL_AUTH: "true", LOCAL_DISPLAY_NAME: Tester,
                  PROOF_OF_WORK: "false", VALIDATE_CRCS: "false"}
  http-desktop:
    image: osrs-rsps-test:241
    container_name: osrs-openrune-http-desktop
    restart: unless-stopped
    ports: ["${OPENRUNE_DESKTOP_HTTP_PORT:-8082}:8080"]
    volumes: ["${SIDECAR_DATA}:/data:ro", "./jav_config.ws.template:/app/protocol/jav_config.ws.template:ro"]
    environment: {WORLD_HOST: "127.0.0.1", HTTP_PUBLIC_PORT: "${OPENRUNE_DESKTOP_HTTP_PORT:-8082}", WORLD_ID: "255", SAVE_DIR: /tmp/saves,
                  JAV_CONFIG_TEMPLATE: /app/protocol/jav_config.ws.template, LOCAL_AUTH: "false", PROOF_OF_WORK: "false", VALIDATE_CRCS: "false"}
volumes:
  openrune-pgdata:
